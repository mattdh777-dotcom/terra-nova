<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Nova Architect | 2026 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .slider { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 5px; background: #e2e8f0; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #10b981; cursor: pointer; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        .choice-btn.selected { border-color: #10b981; background-color: #ecfdf5; color: #065f46; }
        .option-row { padding-right: 15px; margin-bottom: 24px; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">

    <header class="w-full max-w-3xl mb-6 text-center">
        <h1 class="text-3xl font-bold text-emerald-800 tracking-tight">Project Terra Nova</h1>
        <p class="text-slate-500 italic mt-1">A Guide to Flourishing Islands</p>
    </header>

    <main id="app-container" class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl p-6 md:p-10 border border-slate-100">
        
        <div id="screen-welcome" class="text-center py-6">
            <div class="mb-6 text-7xl">🏝️</div>
            <h2 class="text-2xl font-semibold mb-4 text-slate-800">The Architect's Journal</h2>
            <div class="mb-10 max-w-sm mx-auto">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 text-left">What is the name of your island?</label>
                <input type="text" id="island-name-input" placeholder="e.g. Hope Haven" class="w-full p-4 rounded-xl border-2 border-slate-100 text-lg font-semibold text-slate-700 text-center">
            </div>
            <button onclick="startApp()" class="bg-emerald-600 text-white px-10 py-4 rounded-2xl font-bold hover:bg-emerald-700 shadow-lg transition-all active:scale-95">Start Building</button>
        </div>

        <div id="screen-question" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <span id="category-label" class="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs uppercase tracking-widest font-bold rounded-full">Category</span>
                <span id="total-display" class="text-sm font-bold text-slate-400 font-mono">Step 1 of 8</span>
            </div>
            <h2 id="question-text" class="text-xl font-semibold mb-2 text-slate-800 uppercase tracking-tight">Question Text</h2>
            <p id="instruction-text" class="text-sm text-slate-500 mb-8 italic"></p>
            <div id="options-container" class="space-y-8 overflow-y-auto max-h-[55vh] pr-4"></div>
            <div class="mt-12 pt-6 border-t border-slate-100 flex justify-end">
                <button id="next-btn" onclick="nextStep()" class="bg-slate-800 text-white px-10 py-4 rounded-xl font-bold transition-all shadow-md">Next Step</button>
            </div>
        </div>

        <div id="screen-results" class="hidden py-4">
            <div class="text-center mb-8">
                <h2 id="island-profile-title" class="text-sm font-bold text-slate-400 uppercase tracking-widest italic">Flourishing Profile</h2>
                <div id="score-display" class="text-7xl font-extrabold text-emerald-600 my-2 font-mono">0</div>
                <p id="outcome-title" class="text-lg font-semibold text-emerald-800 italic uppercase tracking-wide"></p>
            </div>
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 uppercase text-xs tracking-widest">Section Results</h3>
            <div id="sectional-results" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10"></div>
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 uppercase text-xs tracking-widest">Real-World Meaning</h3>
            <div id="detailed-feedback-container" class="space-y-4 mb-8"></div>
            <button onclick="location.reload()" class="w-full bg-slate-800 text-white px-8 py-4 rounded-2xl font-bold hover:bg-black transition-all">Build a new version</button>
        </div>
    </main>

    <script>
        const projectData = [
            { type: "single", category: "Foundation", options: [{ name: "Volcanic Island (Lava rock)", flourish: 9 }, { name: "Continental Fragment (Old land)", flourish: 8 }, { name: "Coral Atoll (Sea life)", flourish: 10 }] },
            { type: "single", category: "Climate", options: [{ name: "Tropical / Subtropical (Hot/Wet)", flourish: 10 }, { name: "Temperate (Mild)", flourish: 9 }, { name: "Polar (Freezing)", flourish: 4 }, { name: "Arid (Very Dry)", flourish: 5 }] },
            { type: "mix", category: "Food", options: [{ name: "Arable Farming (Crops)", flourish: 8 }, { name: "Pastoral Farming (Animals)", flourish: 4 }, { name: "Mariculture (Sea-based)", flourish: 7 }, { name: "Vertical & Hydroponic (High-tech)", flourish: 9 }, { name: "Insect Farming (Low-waste)", flourish: 10 }] },
            { type: "mix", category: "Energy", options: [{ name: "Solar Power", flourish: 10 }, { name: "Wind Power", flourish: 10 }, { name: "Hydroelectric", flourish: 9 }, { name: "Geothermal", flourish: 10 }, { name: "Wave & Tidal", flourish: 10 }, { name: "Biomass", flourish: 7 }, { name: "Nuclear", flourish: 5 }, { name: "Fossil Fuels", flourish: 1 }] },
            { type: "mix", category: "Drinking Water", options: [{ name: "Surface Water", flourish: 7 }, { name: "Reservoirs & Dams", flourish: 6 }, { name: "Rainwater Collection", flourish: 10 }, { name: "Groundwater (Wells)", flourish: 8 }, { name: "Desalination", flourish: 4 }] },
            { type: "mix", category: "Homes", options: [{ name: "Cob & Rammed Earth", flourish: 10 }, { name: "Timber Framing", flourish: 9 }, { name: "Dry Stone", flourish: 10 }, { name: "Earth-Sheltered", flourish: 10 }, { name: "Stilt Houses", flourish: 9 }, { name: "Flat-Pack & Prefab", flourish: 7 }, { name: "Shipping Containers", flourish: 6 }, { name: "Bricks and Mortar", flourish: 5 }, { name: "High-rise homes", flourish: 4 }] },
            { type: "mix", category: "Decisions", options: [{ name: "Everyone Decides", flourish: 10 }, { name: "Choosing Reps", flourish: 8 }, { name: "One Person in Charge", flourish: 2 }, { name: "No Leaders", flourish: 10 }, { name: "The Rulebook", flourish: 7 }] },
            { type: "spectrum", category: "Social Life", options: [{ name: "Travel", low: "High-Speed Roads", high: "Walkable Streets" }, { name: "Connection", low: "Private & Separate", high: "Shared Heart" }, { name: "Public Life", low: "No Meeting Places", high: "Village Hub" }, { name: "Nature", low: "Concrete & Sterile", high: "Nature-First" }, { name: "Age Mix", low: "Separate Ages", high: "Mixed Ages" }, { name: "Creation", low: "Buying everything", high: "Maker District" }] }
        ];

        const contextMultipliers = {
            "Coral Atoll (Sea life)": { "Food": { "Arable Farming (Crops)": 0.5, "Mariculture (Sea-based)": 1.4 }, "Drinking Water": { "Desalination": 1.5 }, "Homes": { "Stilt Houses": 1.3 } },
            "Arid (Very Dry)": { "Drinking Water": { "Rainwater Collection": 0.4, "Desalination": 1.6 }, "Food": { "Vertical & Hydroponic (High-tech)": 1.3 } },
            "Tropical / Subtropical (Hot/Wet)": { "Energy": { "Solar Power": 1.2 }, "Homes": { "Stilt Houses": 1.3, "Earth-Sheltered": 1.2 } },
            "Polar (Freezing)": { "Energy": { "Solar Power": 0.3, "Wind Power": 1.3 }, "Food": { "Vertical & Hydroponic (High-tech)": 1.4 } }
        };

        let currentStep = 0, finalSectionalScores = [], islandContext = {}, singleChoiceSelection = null, islandName = "Terra Nova";

        function startApp() { 
            const input = document.getElementById('island-name-input').value; 
            if (input) islandName = input; 
            document.getElementById('screen-welcome').classList.add('hidden'); 
            document.getElementById('screen-question').classList.remove('hidden'); 
            showQuestion(); 
        }

        function showQuestion() {
            const data = projectData[currentStep];
            document.getElementById('category-label').innerText = data.category;
            document.getElementById('question-text').innerText = data.category;
            document.getElementById('instruction-text').innerText = data.type === "spectrum" ? "How does it feel to live here?" : (data.type === "single" ? "Choose your foundation." : "Allocate percentages (Total 100%).");
            const container = document.getElementById('options-container'); container.innerHTML = '';

            if (data.type === "single") {
                document.getElementById('total-display').innerText = "Pick One";
                data.options.forEach((opt) => {
                    const btn = document.createElement('button'); btn.className = "choice-btn w-full text-left p-5 rounded-2xl border-2 border-slate-100 bg-white font-semibold hover:border-emerald-300 transition-all";
                    btn.innerText = opt.name; btn.onclick = () => { document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); singleChoiceSelection = opt; validate(); };
                    container.appendChild(btn);
                });
            } else if (data.type === "mix") {
                data.options.forEach((opt, index) => {
                    const item = document.createElement('div'); item.className = "option-row space-y-1";
                    item.innerHTML = `<div class="flex justify-between text-xs font-bold uppercase"><span>${opt.name}</span><span id="val-${index}" class="text-emerald-600">0%</span></div><input type="range" min="0" max="100" value="0" class="slider" id="slider-${index}" oninput="updateAllocation()">`;
                    container.appendChild(item);
                });
                updateAllocation();
            } else if (data.type === "spectrum") {
                document.getElementById('total-display').innerText = "Quality Rating";
                data.options.forEach((opt, index) => {
                    const item = document.createElement('div'); item.className = "option-row space-y-3";
                    item.innerHTML = `<div class="text-xs font-bold text-slate-800 uppercase text-center">${opt.name}</div><input type="range" min="0" max="10" value="5" class="slider" id="spec-${index}" oninput="document.getElementById('spec-val-${index}').innerText = this.value"><div class="flex justify-between text-[10px] font-medium"><span class="w-1/3 text-left text-rose-500">${opt.low}</span><span class="font-bold text-slate-600 text-lg" id="spec-val-${index}">5</span><span class="w-1/3 text-right text-emerald-600">${opt.high}</span></div>`;
                    container.appendChild(item);
                });
            }
            validate();
        }

        function updateAllocation() {
            let total = 0; document.querySelectorAll('.slider').forEach((s, i) => { total += parseInt(s.value); if(document.getElementById(`val-${i}`)) document.getElementById(`val-${i}`).innerText = `${s.value}%`; });
            document.getElementById('total-display').innerText = `Total: ${total}%`;
            document.getElementById('total-display').className = total === 100 ? "text-sm font-bold text-emerald-600" : "text-sm font-bold text-rose-500";
            validate();
        }

        function validate() {
            const data = projectData[currentStep]; const nextBtn = document.getElementById('next-btn');
            let isValid = data.type === "single" ? (singleChoiceSelection !== null) : (data.type === "mix" ? Array.from(document.querySelectorAll('.slider')).reduce((a,b) => a + parseInt(b.value), 0) === 100 : true);
            nextBtn.disabled = !isValid;
            nextBtn.className = `bg-slate-800 text-white px-10 py-4 rounded-xl font-bold transition-all ${isValid ? 'bg-emerald-600 shadow-md' : 'opacity-50 cursor-not-allowed'}`;
        }

        function getSmartFeedback(cat, score, data) {
            const climate = islandContext["Climate"];
            const formation = islandContext["Foundation"];
            
            if (cat === "Food") {
                if (formation.includes("Coral Atoll") && data.some(d => d.name.includes("Arable") && d.p > 30)) 
                    return "⚠️ Nature Check: In a Coral Atoll, the soil is very thin and salty. Arable farming is hard here. Your score reflects the struggle of the land.";
                if (data.some(d => d.name.includes("Insect") && d.p > 40)) 
                    return "🍎 Brilliant: By choosing Insect Farming, you've created a high-protein system that uses almost no space or water. Flourishing!";
                return "🍎 A balanced food mix. You've secured the community's belly while respecting the land's limits.";
            }
            if (cat === "Energy") {
                if (climate.includes("Polar") && data.some(d => d.name.includes("Solar") && d.p > 40)) 
                    return "⚠️ Nature Check: In the Polar zones, the sun disappears for months. Relying on Solar here is difficult. Your score reflects this darkness.";
                if (data.every(d => !d.name.includes("Fossil"))) 
                    return "⚡ Brilliant! 100% clean power. You've harnessed the natural flows of the island to power your future.";
                return "⚡ A steady power mix. You are moving toward the light, but still using a few old, dirty sources.";
            }
            if (cat === "Drinking Water") {
                if (climate.includes("Arid") && data.some(d => d.name.includes("Rainwater") && d.p > 40)) 
                    return "⚠️ Nature Check: In this Arid climate, it rarely rains. Your people might find the tanks are often empty. Your score shows this risk.";
                if (data.some(d => d.name.includes("Rainwater") && d.p > 50)) 
                    return "💧 Beautifully simple. By trusting the clouds, you've met the island's thirst without using heavy energy.";
                return "💧 A resilient mix. You have secured your water across many sources, ensuring no one goes thirsty.";
            }
            if (cat === "Homes") {
                if (climate.includes("Tropical") && data.some(d => d.name.includes("Stilt") && d.p > 50)) 
                    return "🏠 Brilliant: Stilt houses are perfect for the Tropics. They keep people cool and safe from rising tides.";
                return "🏠 Practical shelter. You have prioritised safety and efficiency, making a solid home for all your people.";
            }
            return "Your choices here set the heartbeat for how everyone lives together.";
        }

        function nextStep() {
            const data = projectData[currentStep]; let score = 0, label = "", selectionData = [];
            if (data.type === "single") { 
                score = data.options.find(o => o.name === (singleChoiceSelection ? singleChoiceSelection.name : "")).flourish; 
                label = singleChoiceSelection.name; islandContext[data.category] = label; singleChoiceSelection = null;
            } else if (data.type === "mix") {
                document.querySelectorAll('.slider').forEach((s, i) => {
                    let perc = parseInt(s.value); if(perc > 0) selectionData.push({name: data.options[i].name, p: perc});
                    let val = data.options[i].flourish;
                    [islandContext["Foundation"], islandContext["Climate"]].forEach(ctx => {
                        if (contextMultipliers[ctx] && contextMultipliers[ctx][data.category] && contextMultipliers[ctx][data.category][data.options[i].name]) { val *= contextMultipliers[ctx][data.category][data.options[i].name]; }
                    });
                    score += (perc / 100) * val;
                });
            } else if (data.type === "spectrum") { 
                let sum = 0; document.querySelectorAll('.slider').forEach(s => sum += parseInt(s.value)); score = sum / data.options.length; 
            }
            finalSectionalScores.push({ category: data.category, score: Math.min(10, score), label: label, type: data.type, raw: selectionData });
            currentStep++; if (currentStep < projectData.length) { showQuestion(); } else { showResults(); }
        }

        function showResults() {
            document.getElementById('screen-question').classList.add('hidden'); document.getElementById('screen-results').classList.remove('hidden');
            document.getElementById('island-profile-title').innerText = `${islandName} Flourishing Profile`;
            const scored = finalSectionalScores.filter(s => s.type !== "single");
            const finalIndex = Math.round((scored.reduce((a,c) => a + c.score, 0) / (scored.length * 10)) * 100);
            document.getElementById('score-display').innerText = finalIndex;
            document.getElementById('outcome-title').innerText = finalIndex > 85 ? "A Healthy, Healing Home" : (finalIndex > 65 ? "A Solid Community" : "An Island in Need");
            const container = document.getElementById('sectional-results'); const fbCont = document.getElementById('detailed-feedback-container');
            const icons = {"Food":"🍎", "Energy":"⚡", "Drinking Water":"💧", "Homes":"🏠", "Decisions":"⚖️", "Social Life":"🌟"};
            finalSectionalScores.forEach(s => {
                const item = document.createElement('div'); item.className = "bg-slate-50 p-3 rounded-xl border border-slate-100";
                const perc = Math.round(s.score * 10);
                if (s.type === "single") { item.innerHTML = `<div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${s.category}</div><div class="text-sm font-bold text-slate-800 leading-tight">${s.label}</div>`; }
                else { 
                    item.innerHTML = `<div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${s.category}</div><div class="flex items-center justify-between"><div class="text-xl font-bold text-slate-800">${perc}%</div><div class="w-16 h-1 bg-slate-200 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${perc}%"></div></div></div>`; 
                    const block = document.createElement('div'); block.className = "p-5 bg-white border border-slate-100 rounded-2xl shadow-sm";
                    block.innerHTML = `<h4 class="text-xs font-bold text-emerald-700 uppercase tracking-widest mb-2">${icons[s.category] || "🌟"} ${s.category}</h4><p class="text-sm text-slate-600 font-medium leading-relaxed">${getSmartFeedback(s.category, s.score, s.raw)}</p>`;
                    fbCont.appendChild(block);
                }
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
